<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Custom fiberglass body kits for hot rods, rat rods, muscle, trucks, and classics. Built to fit. Built to last. Built to turn heads." />
  <title>Lowkey Fiberglass — Body Kits for Hot Rods & Rat Rods</title>

  <style>
    :root{
      --bg0:#06070b;
      --bg1:#07080e;
      --card: rgba(255,255,255,.04);
      --card2: rgba(0,0,0,.28);
      --line: rgba(255,255,255,.10);
      --text:#e9ecf2;
      --muted:#aab2c5;

      --gold:#d6b56a;
      --gold2:#f4e2b7;
      --mint:#72f3b6;
      --ice:#93b7ff;
      --red:#ff5d5d;

      --shadow: 0 24px 90px rgba(0,0,0,.65);
      --r: 18px;
      --r2: 28px;

      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family:var(--sans);
      background:
        radial-gradient(1200px 900px at 15% 10%, rgba(214,181,106,.18), transparent 55%),
        radial-gradient(900px 750px at 85% 15%, rgba(114,243,182,.10), transparent 55%),
        radial-gradient(1000px 900px at 50% 100%, rgba(147,183,255,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }

    a{color:inherit;text-decoration:none}
    .wrap{max-width:1200px;margin:0 auto;padding:22px}

    /* Top Bar */
    .topbar{
      position:sticky;top:0;z-index:50;
      backdrop-filter: blur(14px);
      background: rgba(6,7,11,.70);
      border-bottom:1px solid var(--line);
    }
    .topbarInner{
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:14px 22px;
      max-width:1200px;margin:0 auto;
    }
    .brand{
      display:flex;align-items:center;gap:12px;min-width:260px;
    }
    .mark{
      width:44px;height:44px;border-radius:14px;position:relative;overflow:hidden;
      border:1px solid rgba(214,181,106,.26);
      background:
        radial-gradient(circle at 35% 25%, rgba(244,226,183,.92), rgba(214,181,106,.48) 44%, rgba(0,0,0,0) 72%),
        linear-gradient(135deg, rgba(214,181,106,.22), rgba(114,243,182,.10));
      box-shadow: 0 14px 48px rgba(214,181,106,.10);
    }
    .mark:after{
      content:"";
      position:absolute;inset:-40%;
      background: conic-gradient(from 180deg, rgba(214,181,106,0), rgba(244,226,183,.28), rgba(114,243,182,.12), rgba(214,181,106,0));
      animation: spin 7.2s linear infinite;
      opacity:.95;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .brand h1{
      margin:0;
      font-size:13px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:rgba(244,226,183,.95);
    }
    .brand p{
      margin:2px 0 0;
      font-size:12px;
      color:var(--muted);
    }
    nav{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;
    }
    .navLink{
      font-size:13px;color:rgba(233,236,242,.86);
      padding:8px 10px;border-radius:12px;border:1px solid transparent;
    }
    .navLink:hover{border-color:rgba(255,255,255,.10);background:rgba(255,255,255,.03)}

    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      padding:12px 14px;border-radius:14px;
      border:1px solid rgba(214,181,106,.30);
      background: linear-gradient(135deg, rgba(214,181,106,.18), rgba(114,243,182,.06));
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      color:rgba(244,226,183,.95);
      font-weight:800;
      letter-spacing:.02em;
      font-size:13px;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      cursor:pointer;
      white-space:nowrap;
    }
    .btn:hover{transform: translateY(-1px);border-color:rgba(244,226,183,.55);background:linear-gradient(135deg, rgba(214,181,106,.26), rgba(114,243,182,.08))}
    .btn.secondary{
      color:rgba(233,236,242,.92);
      border-color:rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      box-shadow:none;
      font-weight:750;
    }

    /* Hero */
    .hero{
      padding:34px 0 10px;
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap:16px;
      align-items:stretch;
    }
    @media (max-width: 980px){.hero{grid-template-columns:1fr}}
    .heroCard{
      border:1px solid var(--line);
      border-radius: var(--r2);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.18));
      box-shadow: var(--shadow);
      padding:22px;
      position:relative;overflow:hidden;
    }
    .heroCard:before{
      content:"";
      position:absolute;inset:-2px;
      background:
        radial-gradient(700px 260px at 15% 10%, rgba(214,181,106,.22), transparent 60%),
        radial-gradient(600px 260px at 90% 15%, rgba(114,243,182,.14), transparent 60%),
        radial-gradient(720px 320px at 50% 110%, rgba(147,183,255,.12), transparent 60%);
      opacity:.9;pointer-events:none;
    }
    .heroCard > *{position:relative}
    .kicker{
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;
      font-size:12px;letter-spacing:.10em;text-transform:uppercase;
      color:rgba(233,236,242,.80);
    }
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 10px;border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
    }
    .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 18px rgba(114,243,182,.35)}
    .dot.gold{background:var(--gold);box-shadow:0 0 18px rgba(214,181,106,.35)}
    .dot.ice{background:var(--ice);box-shadow:0 0 18px rgba(147,183,255,.30)}

    h2{
      margin:14px 0 10px;
      font-size:44px;
      line-height:1.05;
      letter-spacing:-.03em;
    }
    .sub{
      margin:0 0 14px;
      color:rgba(233,236,242,.84);
      line-height:1.65;
      max-width:68ch;
      font-size:15px;
    }

    .ctaRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .micro{
      display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;
    }
    @media (max-width: 760px){.micro{grid-template-columns:1fr}}
    .mini{
      border:1px solid var(--line);
      background: rgba(0,0,0,.18);
      border-radius: var(--r);
      padding:14px;
    }
    .mini b{
      display:block;
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:rgba(244,226,183,.92);
    }
    .mini span{
      display:block;margin-top:6px;
      color:rgba(233,236,242,.78);
      font-size:13px;line-height:1.55;
    }

    /* Right hero image panel */
    .viz{
      border:1px solid var(--line);
      border-radius: var(--r2);
      background: rgba(0,0,0,.18);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
      min-height:420px;
    }
    .vizHeader{
      position:absolute;left:16px;right:16px;top:14px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
      z-index:3;
    }
    .badge{
      font-family:var(--mono);
      font-size:11px;
      letter-spacing:.10em;
      text-transform:uppercase;
      padding:8px 10px;border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      color:rgba(233,236,242,.78);
    }
    .badge.gold{
      border-color: rgba(214,181,106,.28);
      color:rgba(244,226,183,.90);
      background: rgba(214,181,106,.08);
    }
    .vizFooter{
      position:absolute;left:16px;right:16px;bottom:14px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
      z-index:3;
    }
    .vizFooter .note{
      color:rgba(233,236,242,.72);
      font-size:12px;
      line-height:1.45;
      max-width:70ch;
    }

    /* Sections */
    section{padding:18px 0}
    .sectionTitle{
      display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
      margin:18px 0 10px;
    }
    .sectionTitle h3{
      margin:0;
      font-size:16px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:rgba(244,226,183,.95);
    }
    .sectionTitle p{
      margin:0;
      color:rgba(233,236,242,.68);
      font-size:13px;
      max-width:80ch;
      line-height:1.55;
    }

    /* Gallery */
    .grid3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:12px;
    }
    @media (max-width: 980px){.grid3{grid-template-columns:1fr}}
    .card{
      border:1px solid var(--line);
      border-radius: var(--r2);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.20));
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
      overflow:hidden;
      position:relative;
    }
    .cardTop{
      padding:14px 16px 10px;
      display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
      border-bottom:1px solid rgba(255,255,255,.07);
      background: rgba(0,0,0,.12);
    }
    .cardTop b{
      display:block;
      font-size:13px;
      letter-spacing:.08em;
      color:rgba(244,226,183,.92);
      text-transform:uppercase;
    }
    .cardTop span{
      display:block;
      margin-top:4px;
      color:rgba(233,236,242,.72);
      font-size:12px;
      line-height:1.4;
    }
    .chip{
      font-family:var(--mono);
      font-size:11px;
      padding:7px 10px;border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      color:rgba(233,236,242,.76);
      white-space:nowrap;
      height:fit-content;
    }
    .chip.mint{border-color: rgba(114,243,182,.22); background: rgba(114,243,182,.08)}
    .chip.gold{border-color: rgba(214,181,106,.26); background: rgba(214,181,106,.08); color: rgba(244,226,183,.92)}
    .chip.ice{border-color: rgba(147,183,255,.22); background: rgba(147,183,255,.08)}

    .cardArt{
      aspect-ratio: 16/10;
      width:100%;
      background:
        radial-gradient(600px 240px at 25% 25%, rgba(214,181,106,.16), transparent 60%),
        radial-gradient(520px 240px at 85% 30%, rgba(114,243,182,.12), transparent 60%),
        radial-gradient(600px 260px at 55% 110%, rgba(147,183,255,.10), transparent 60%),
        rgba(0,0,0,.18);
      position:relative;
    }
    .cardArt svg{position:absolute;inset:0;width:100%;height:100%}
    .cardBody{padding:14px 16px 16px}
    .bullets{margin:0;padding:0;list-style:none;display:grid;gap:9px}
    .bullets li{
      display:flex;gap:10px;align-items:flex-start;
      color:rgba(233,236,242,.76);
      font-size:13px;line-height:1.55;
    }
    .check{
      width:18px;height:18px;border-radius:7px;
      border:1px solid rgba(114,243,182,.25);
      background: rgba(114,243,182,.10);
      display:grid;place-items:center;
      flex:0 0 auto;margin-top:2px;
      color:rgba(114,243,182,.95);
      font-family:var(--mono);
      font-weight:900;
    }

    /* Capabilities */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width: 980px){.grid2{grid-template-columns:1fr}}
    .panel{
      border:1px solid var(--line);
      border-radius: var(--r2);
      background: rgba(0,0,0,.18);
      padding:16px;
      position:relative;
      overflow:hidden;
    }
    .panel:before{
      content:"";
      position:absolute;inset:-2px;
      background:
        radial-gradient(540px 240px at 15% 15%, rgba(214,181,106,.16), transparent 60%),
        radial-gradient(520px 240px at 90% 20%, rgba(114,243,182,.10), transparent 60%);
      opacity:.9;pointer-events:none;
    }
    .panel > *{position:relative}
    .panel h4{
      margin:0 0 6px;
      font-size:14px;
      letter-spacing:.10em;
      text-transform:uppercase;
      color:rgba(244,226,183,.92);
    }
    .panel p{margin:0;color:rgba(233,236,242,.74);line-height:1.65;font-size:13px}
    .divider{height:1px;background:rgba(255,255,255,.08);margin:14px 0}

    /* Contact */
    .form{
      border:1px solid var(--line);
      border-radius: var(--r2);
      background: rgba(0,0,0,.16);
      padding:16px;
    }
    label{
      display:block;
      margin:10px 0 6px;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:rgba(233,236,242,.68);
    }
    input,textarea,select{
      width:100%;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      color:rgba(233,236,242,.92);
      padding:12px 12px;
      outline:none;
      font-size:14px;
    }
    textarea{min-height:120px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width: 760px){.row{grid-template-columns:1fr}}
    .fine{
      margin-top:10px;
      color:rgba(233,236,242,.62);
      font-size:12px;
      line-height:1.6;
    }
    .footer{
      padding:22px 0 40px;
      border-top:1px solid rgba(255,255,255,.08);
      color:rgba(233,236,242,.62);
      font-size:12px;
      line-height:1.6;
    }
